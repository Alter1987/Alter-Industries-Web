<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef1f5; --surface:#ffffff; --ink:#122033; --muted:#55637a; --line:#d3dae5;
  --accent:#1f5fd6; --on-accent:#ffffff;
  --head:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#5018DD; --surface:#000000; --ink:#e8edf5; --muted:#9aa8bd; --line:#2a374b;
    --accent:#6ea2ff; --on-accent:#0e1623;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1623; --surface:#16202f; --ink:#e8edf5; --muted:#9aa8bd; --line:#2a374b;
  --accent:#6ea2ff; --on-accent:#0e1623;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.6 var(--body);-webkit-font-smoothing:antialiased}
main{max-width:46rem;margin:0 auto;padding:clamp(2rem,8vw,5rem) 1.5rem 3rem}
h1,h2{font-family:var(--head);margin:0;line-height:1.05;letter-spacing:-.02em}
h1{font-size:clamp(2.8rem,12vw,5.5rem);font-weight:800}
h2{font-size:1.5rem;font-weight:600;margin-bottom:1rem}
.role{margin:1rem 0 0;font-size:1.2rem;color:var(--muted)}
.role b{color:var(--ink);font-weight:600}
.tagline{margin:1.5rem 0 0;font-size:1.35rem;max-width:34rem}
.btns{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:2rem}
.btn{display:inline-block;padding:.7rem 1.2rem;border-radius:.6rem;font-weight:600;text-decoration:none;border:2px solid var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
section{margin-top:clamp(3rem,9vw,5rem)}
p{margin:0 0 1rem;max-width:38rem}
.services{list-style:none;margin:0;padding:0;display:grid;gap:.75rem}
.services li{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:.4rem;padding:1rem 1.2rem}
.services strong{display:block;font-family:var(--head);font-size:1.15rem}
.services span{color:var(--muted)}
.links{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.links a{display:flex;justify-content:space-between;gap:1rem;padding:1rem .25rem;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:500}
.links a span{color:var(--muted);font-weight:400;overflow-wrap:anywhere;text-align:right}
.links a:hover{background:var(--surface)}
footer{margin-top:4rem;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
  <header>
    <h1 id="name"></h1>
    <p class="role" id="role"></p>
    <p class="tagline" id="tagline"></p>
    <div class="btns" id="btns"></div>
  </header>
  <section id="about-sec"><h2>About</h2><div id="about"></div></section>
  <section id="services-sec"><h2 id="services-title"></h2><ul class="services" id="services"></ul></section>
  <section id="links-sec"><h2>Find me online</h2><ul class="links" id="links"></ul></section>
  <footer id="footer"></footer>
</main>

<script>
/* ============================================================
   EDIT THIS BLOCK ONLY. Change the text between the quotes,
   save, and the whole page updates. Delete a line to hide it.
   ============================================================ */
const SITE = {
  name: "Your Name",
  role: "Founder",
  company: "Alter Industries",
  tagline: "One sentence about what you do and who it’s for.",

  // Main buttons under your name (first one is highlighted)
  buttons: [
    { label: "Email me", url: "mailto:you@example.com" },
    { label: "Visit the company", url: "https://example.com" }
  ],

  // Each string is its own paragraph
  about: [
    "Write a short intro about yourself here: who you are, where you’re based, and what drives you.",
    "Add a second paragraph about your company’s story or mission if you like."
  ],

  servicesTitle: "What the company does",
  services: [
    { title: "Service or product one", text: "A short line explaining it." },
    { title: "Service or product two", text: "A short line explaining it." },
    { title: "Service or product three", text: "A short line explaining it." }
  ],

  // Every link you want on the page
  links: [
    { label: "Website", url: "https://example.com" },
    { label: "Email", url: "mailto:you@example.com" },
    { label: "Discord", url: "https://discord.gg/yourinvite" },
    { label: "YouTube", url: "https://youtube.com/@yourchannel" },
    { label: "X / Twitter", url: "https://x.com/yourhandle" },
    { label: "GitHub", url: "https://github.com/yourname" }
  ],

  // Colors: change the hex codes to restyle the whole page
  accent: "#1f5fd6",        // light mode accent
  accentDark: "#6ea2ff",    // dark mode accent

  footer: "© 2026 Alter Industries"
};
/* ============================================================ */

(function(){
  const $ = id => document.getElementById(id);
  const root = document.documentElement;
  const show = (id, on) => { if(!on) $(id).style.display = "none"; };
  const pretty = u => u.replace(/^mailto:/,"").replace(/^https?:\/\//,"").replace(/\/$/,"");

  document.title = SITE.company ? SITE.name + " · " + SITE.company : SITE.name;
  $("name").textContent = SITE.name;

  const role = $("role");
  if (SITE.role || SITE.company) {
    if (SITE.role) role.append(SITE.role);
    if (SITE.role && SITE.company) role.append(" at ");
    if (SITE.company) { const b = document.createElement("b"); b.textContent = SITE.company; role.append(b); }
  } else role.style.display = "none";

  $("tagline").textContent = SITE.tagline || "";
  show("tagline", SITE.tagline);

  (SITE.buttons || []).forEach((b,i) => {
    const a = document.createElement("a");
    a.className = "btn" + (i === 0 ? " primary" : "");
    a.href = b.url; a.textContent = b.label;
    if (!b.url.startsWith("mailto:")) { a.target = "_blank"; a.rel = "noopener"; }
    $("btns").append(a);
  });

  (SITE.about || []).forEach(t => { const p = document.createElement("p"); p.textContent = t; $("about").append(p); });
  show("about-sec", (SITE.about || []).length);

  $("services-title").textContent = SITE.servicesTitle || "What we do";
  (SITE.services || []).forEach(s => {
    const li = document.createElement("li");
    const st = document.createElement("strong"); st.textContent = s.title;
    const sp = document.createElement("span"); sp.textContent = s.text || "";
    li.append(st, sp); $("services").append(li);
  });
  show("services-sec", (SITE.services || []).length);

  (SITE.links || []).forEach(l => {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = l.url;
    if (!l.url.startsWith("mailto:")) { a.target = "_blank"; a.rel = "noopener"; }
    const n = document.createElement("div"); n.textContent = l.label;
    const s = document.createElement("span"); s.textContent = pretty(l.url);
    a.append(n, s); li.append(a); $("links").append(li);
  });
  show("links-sec", (SITE.links || []).length);

  $("footer").textContent = SITE.footer || "";
  show("footer", SITE.footer);

  // Apply accent colors from the config
  const st = document.createElement("style");
  st.textContent =
    ":root{--accent:" + SITE.accent + "}" +
    "@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--accent:" + SITE.accentDark + "}}" +
    ":root[data-theme=\"dark\"]{--accent:" + SITE.accentDark + "}";
  document.head.append(st);
})();
</script>
</body>
</html>
